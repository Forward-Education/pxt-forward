# Forward build: pristine check, overlay, invariants and pxt staticpkg on every push and PR.
# The staging deploy to Cloudflare Pages is added in M0, once the Pages project and its API
# token exist.
name: fwd-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fwd-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Fetch upstream tags
        run: git fetch --no-tags "$(node -p 'require("./forward/upstream.json").repo')" '+refs/tags/*:refs/upstream-tags/*'

      - name: Build
        env:
          FWD_BUILD_DIR: ${{ runner.temp }}/fwd-build
        run: bash forward/scripts/build.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forward-editor-${{ github.sha }}
          path: ${{ runner.temp }}/fwd-build/built/packaged
          retention-days: 14
