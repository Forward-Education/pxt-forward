<!-- Forward override of pxt-core docfiles/tracking.html (documentation pages). No analytics.
     Keeps pxtweb.js, which the docs need, and gives pxt a telemetry sink that does nothing. -->
<script type="text/javascript" src="/doccdn/pxtweb.js"></script>
<script type="text/javascript">
    window.appInsights = window.appInsights || {
        trackEvent: function () {},
        trackException: function () {},
        trackPageView: function () {},
        trackMetric: function () {},
        trackTrace: function () {},
        flush: function () {}
    };
    window.loadAppInsights = function () { return false; };
    pxt.initAnalyticsAsync();
</script>
